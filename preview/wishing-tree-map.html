<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wishing Tree · Map Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#303a68;font:14px Arial,sans-serif}header{min-height:68px;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;flex-wrap:wrap}strong{font-size:16px}nav{display:flex;gap:6px}button{border:1px solid #d8d4cd;border-radius:10px;padding:10px 12px;background:#fff;color:#303a68;font:inherit;cursor:pointer;min-height:40px}button[aria-pressed=true]{background:#303a68;color:white}main{position:relative;height:calc(100dvh - 108px);min-height:320px}canvas{display:block;width:100%;height:100%;touch-action:manipulation}footer{padding:10px 14px;font-size:12px;line-height:1.5}#loading{position:absolute;inset:0;display:grid;place-content:center;background:#fff8f1}#loading[hidden]{display:none}@media(max-width:600px){header{justify-content:center}strong{width:100%;text-align:center}main{height:calc(100dvh - 150px)}}
</style></head><body><header><strong>Wishing Tree · Map Preview</strong><nav><button id="overview">Full map</button><button id="close">Phone view</button><button id="compare" aria-pressed="false">Show original</button></nav></header><main><canvas id="map" aria-label="Existing map with the selected wishing tree over the central plaza tree"></canvas><div id="loading">Loading preview…</div></main><footer>Appearance preview only. The live multiplayer map is unchanged.</footer><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const map=new Image(),tree=new Image();
let mode=innerWidth<700?'close':'overview',showOriginal=false,ready=false;
// Source artwork coordinates: cover the existing central tree, keep its flowerbed.
const placement={x:724,y:417,width:240,height:160};
map.src='../map%20draft.png';tree.src='assets/wishing-tree-simple-v1.png';
function loaded(image){return new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;if(image.complete&&image.naturalWidth)resolve()})}
function draw(){
 const box=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(box.width*ratio);canvas.height=Math.round(box.height*ratio);
 ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#fff8f1';ctx.fillRect(0,0,box.width,box.height);
 document.getElementById('overview').setAttribute('aria-pressed',mode==='overview');document.getElementById('close').setAttribute('aria-pressed',mode==='close');document.getElementById('compare').setAttribute('aria-pressed',showOriginal);
 if(!ready)return;
 const scale=mode==='overview'?Math.min(box.width/map.width,box.height/map.height):box.width/(600/1.35/1.6);
 const x=mode==='overview'?(box.width-map.width*scale)/2:box.width/2-724*scale;
 const y=mode==='overview'?(box.height-map.height*scale)/2:box.height*.46-435*scale;
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.drawImage(map,0,0);
 if(!showOriginal)ctx.drawImage(tree,placement.x-placement.width/2,placement.y-placement.height/2,placement.width,placement.height);
 ctx.restore();
}
Promise.all([loaded(map),loaded(tree)]).then(()=>{ready=true;document.getElementById('loading').hidden=true;draw()}).catch(()=>{document.getElementById('loading').textContent='Image could not load. Please refresh.'});
document.getElementById('overview').onclick=()=>{mode='overview';draw()};document.getElementById('close').onclick=()=>{mode='close';draw()};document.getElementById('compare').onclick=()=>{showOriginal=!showOriginal;draw()};addEventListener('resize',draw);draw();
</script></body></html>
