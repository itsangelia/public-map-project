<style>

te;font-size:10px;display:grid;place-items:center}.bottom{padding:17px 20px 29px}.next{width:100%;min-height:49px;border:1px solid #394268;border-radius:15px;background:var(--navy);color:white;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:12px}.next:disabled{cursor:default;border-color:#d1c7b5;background:#e6dece;color:#a19582}.next .arrow{font-size:19px}.turn-caption{margin:9px 0 0;text-align:center;font-size:11px;color:#9b8d79;min-height:13px}.result{padding:9px 24px 20px;text-align:center}.result .eyebrow{font-size:10px;letter-spacing:2px;color:#829067;text-transform:uppercase;margin:0 0 8px}.result h2{font:700 25px Georgia,serif;color:var(--navy);margin:0 0 7px}.result .makers{font-size:12px;color:#8f7d68;margin:0 0 13px}.recipe{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:0 0 20px}.recipe span{padding:6px 9px;border-radius:12px;background:#eee9d9;color:#7b6b56;font-size:11px}.result .next{margin-top:4px}.map-link{display:inline-block;margin-top:14px;font-size:12px;color:#89735f;text-underline-offset:3px}.finished .stage{height:clamp(255px,38svh,340px)}.finished .stage-note{display:none}.finished .players{margin-bottom:12px}.finished .player{border-color:#b6bf9d;background:#f0f1e3;color:#6e7857}.result-star{fill:#e4bd70;stroke:#9e7943;stroke-width:1.5}.liquid-change{animation:pour .3s ease-out}@keyframes pour{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:360px){.topbar{padding:13px 14px 8px}.players{margin:7px 14px 12px}.player{min-width:120px;padding:7px 10px}.choose{padding:9px 14px 0}.options{gap:7px}.option{min-height:111px}.bottom{padding:14px 14px 27px}.steps{gap:5px;margin:0 12px}.step-line{width:8px}.choose-heading h2{font-size:20px}}@media(max-height:710px){.topbar{padding-top:10px}.players{margin-top:5px;margin-bottom:10px}.stage{height:205px;margin-top:0}.option{min-height:104px;gap:2px;padding-top:8px;padding-bottom:7px}.option svg{width:48px;height:48px}.choose{padding-top:6px}.choose-heading{margin-bottom:10px}.bottom{padding-top:12px}.finished .stage{height:230px}}@media(min-width:600px){.app{margin:24px auto;min-height:0;border:1px solid #d9c8ae;border-radius:25px;box-shadow:0 12px 40px #65503a16}.stage{height:255px}.finished .stage{height:300px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}

<body>
<main class="app" id="app">
<div class="awning" aria-hidden="true"></div>
<header class="topbar"><a class="exit" href="https://itsangelia.github.io/public-map-project/campus-ab81af9580087887.html?room=campus" aria-label="Back to map">‹</a><div class="brand"><h1>Drink Together</h1><p>A little mix, made by two.</p></div><span></span></header>
<section class="players" aria-label="Alternating players"><div class="player active" data-player="0"><span class="avatar">A</span><span><span class="player-name">Player A</span><span class="player-status">Your turn</span></span></div><div class="player" data-player="1"><span class="avatar">B</span><span><span class="player-name">Player B</span><span class="player-status">Up next</span></span></div></section>
<nav class="steps" aria-label="Drink-making progress"></nav>
<section class="stage" aria-label="Your drink"><svg id="drink-illustration" viewBox="0 0 300 320" role="img" aria-label="An empty cup ready for your choices"></svg><div class="stage-note" id="stage-note">Something lovely starts here.</div></section>
<section class="choose" id="choose"><div class="choose-heading"><h2 id="step-title">Choose a base</h2><span class="step-number" id="step-number">01 / 04</span></div><div class="options" id="options" role="group" aria-labelledby="step-title"></div></section>
<footer class="bottom" id="bottom"><button class="next" id="next" disabled><span id="next-label">Add &amp; pass</span><span class="arrow" aria-hidden="true">→</span></button><p class="turn-caption" id="turn-caption">Player A chooses the base.</p></footer>
<section class="result" id="result" hidden aria-labelledby="result-title"><p class="eyebrow">Made together</p><h2 id="result-title"></h2><p class="makers">A creation by Player A + Player B</p><div class="recipe" id="recipe"></div><button class="next" id="restart">Make another together <span class="arrow" aria-hidden="true">↻</span></button><a class="map-link" href="https://itsangelia.github.io/public-map-project/campus-ab81af9580087887.html?room=campus">Back to map</a></section>
<span class="preview-tag">INTERFACE PREVIEW</span><div id="announcement" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
</main>
<script>
// Local appearance/interaction preview only. No accounts, matchmaking or Firebase.
const stages=[
 {label:'Base',title:'Choose a base',owner:0,caption:'Player A chooses the base.',options:[{id:'sparkling',name:'Sparkling Water',color:'#cde4dc'},{id:'milk-tea',name:'Milk Tea',color:'#d9ad7c'},{id:'slush',name:'Slush',color:'#c9d9d9'}]},
 {label:'Flavor',title:'Add a flavor',owner:1,caption:'Player B adds the flavor.',options:[{id:'strawberry',name:'Strawberry',color:'#e7a0a0'},{id:'matcha',name:'Matcha',color:'#a6b778'},{id:'mango',name:'Mango',color:'#eac078'}]},
 {label:'Toppings',title:'Pick a topping',owner:0,caption:'Player A picks the topping.',options:[{id:'pearls',name:'Pearls'},{id:'jelly',name:'Coconut Jelly'},{id:'red-bean',name:'Red Bean'}]},
 {label:'Finish',title:'The finishing touch',owner:1,caption:'Player B adds the finishing touch.',options:[{id:'foam',name:'Milk Foam'},{id:'ice-cream',name:'Ice Cream'},{id:'lemon',name:'Lemon Slice'}]}
];
const choices=[null,null,null,null];let step=0,finished=false;
const outline='fill="none" stroke="#654936" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"';
function icon(id){
 const cup=(fill,extras='')=>`<path d="M17 23h34l-5 34q-12 6-24 0Z" fill="${fill}" stroke="#76533b" stroke-width="3" stroke-linejoin="round"/><ellipse cx="34" cy="23" rx="17" ry="4" fill="#fff8df" stroke="#76533b" stroke-width="3"/>${extras}`;
 const icons={
 'sparkling':cup('#d6e7df','<g fill="#fffdf1" stroke="#9dbbb1" stroke-width="1"><circle cx="29" cy="36" r="3"/><circle cx="39" cy="46" r="3"/><circle cx="29" cy="51" r="2"/></g><path d="m37 7 4 14M45 12l-1 8" '+outline+'/>'),
 'milk-tea':cup('#dab287','<g fill="#80573b"><circle cx="29" cy="50" r="3"/><circle cx="38" cy="52" r="3"/><circle cx="34" cy="44" r="3"/></g><path d="M36 9 32 23" '+outline+'/>'),
 'slush':cup('#cbdcd9','<path d="M18 22q-1-9 8-10 4-10 12-2 11-1 13 12Z" fill="#eaf0e5" stroke="#76533b" stroke-width="3"/><path d="m29 17 4 2m5-6 3 3m-4 9 5-1" stroke="#a4b6af" stroke-width="2"/>'),
 'strawberry':'<path d="M15 27q18-13 37 0-1 24-18 34Q17 50 15 27Z" fill="#df9690" stroke="#76533b" stroke-width="3"/><path d="m34 27-14-8 11 1 3-10 4 10 11-1Z" fill="#a7b17e" stroke="#76533b" stroke-width="2.5"/><g fill="#ffe1b2"><ellipse cx="27" cy="34" rx="1.5" ry="2"/><ellipse cx="40" cy="34" rx="1.5" ry="2"/><ellipse cx="33" cy="43" rx="1.5" ry="2"/><ellipse cx="26" cy="45" rx="1.5" ry="2"/><ellipse cx="39" cy="45" rx="1.5" ry="2"/></g>',
 'matcha':'<path d="M12 35h44q-3 20-22 22Q16 55 12 35Z" fill="#ced2ad" stroke="#76533b" stroke-width="3"/><ellipse cx="34" cy="35" rx="22" ry="5" fill="#a7b978" stroke="#76533b" stroke-width="3"/><path d="M30 29Q21 17 42 9q6 16-12 20Z" fill="#9aa96e" stroke="#76533b" stroke-width="2.5"/><path d="m29 29 11-16" stroke="#647747" stroke-width="2"/>',
 'mango':'<path d="M17 20q21-17 35 6 8 23-13 32Q12 63 13 39Z" fill="#eac078" stroke="#76533b" stroke-width="3"/><path d="M24 20q17-9 23 10 8 17-10 23Q19 53 19 36Z" fill="#f8d591"/><path d="M33 13q6-8 15-4-3 10-15 9" fill="#a3b17d" stroke="#76533b" stroke-width="2.5"/>',
 'pearls':'<path d="M10 39h48q-4 18-24 19Q15 57 10 39Z" fill="#f4e5ce" stroke="#76533b" stroke-width="3"/><g fill="#73503c" stroke="#52382c" stroke-width="2"><circle cx="21" cy="34" r="7"/><circle cx="36" cy="35" r="7"/><circle cx="47" cy="31" r="7"/><circle cx="31" cy="23" r="7"/></g>',
 'jelly':'<path d="M10 40h48q-4 17-24 18Q15 57 10 40Z" fill="#dfe5cf" stroke="#76533b" stroke-width="3"/><g fill="#fff4d5" stroke="#a58c64" stroke-width="2.5" stroke-linejoin="round"><path d="m15 23 15-4 2 17-14 3Z"/><path d="m34 16 15 4-3 16-14-2Z"/><path d="m29 32 14 2-2 12-13-2Z"/></g>',
 'red-bean':'<path d="M10 40h48q-4 17-24 18Q15 57 10 40Z" fill="#f0ddce" stroke="#76533b" stroke-width="3"/><g fill="#a46e68" stroke="#754d47" stroke-width="2"><ellipse cx="21" cy="32" rx="6" ry="9" transform="rotate(-30 21 32)"/><ellipse cx="35" cy="23" rx="6" ry="9" transform="rotate(20 35 23)"/><ellipse cx="46" cy="34" rx="6" ry="9" transform="rotate(40 46 34)"/><ellipse cx="32" cy="39" rx="6" ry="8" transform="rotate(-20 32 39)"/></g>',
 'foam':cup('#d7b28c','<path d="M16 24q-4-11 7-11 2-10 12-6 12-4 14 6 10 0 4 12Z" fill="#fff7e0" stroke="#76533b" stroke-width="3"/>'),
 'ice-cream':'<path d="m22 36 24 0-12 26Z" fill="#d9af7d" stroke="#76533b" stroke-width="3"/><path d="m26 42 15 2m-12 6 8 1" stroke="#b78b5e" stroke-width="2"/><path d="M16 34q-5-11 6-14-1-13 12-12 13-1 12 12 11 3 6 14Z" fill="#f3d8b0" stroke="#76533b" stroke-width="3"/>',
 'lemon':'<path d="M12 31a23 23 0 0 0 46 0Z" fill="#eac769" stroke="#76533b" stroke-width="3"/><path d="M17 33a18 18 0 0 0 36 0Z" fill="#fff2bb" stroke="#c5a34e" stroke-width="2"/><path d="m35 33-12 12m12-12v17m0-17 12 12" stroke="#d8bc73" stroke-width="2"/>'
 };return `<svg viewBox="0 0 68 68" aria-hidden="true">${icons[id]}</svg>`;
}
function selected(index){return stages[index].options.find(option=>option.id===choices[index])}
function drawDrink(){
 const base=selected(0),flavor=selected(1),topping=selected(2),finish=selected(3);
 const color=flavor?.color||base?.color||'#f9f1df';let inside='';
 if(base){inside+=`<path d="M80 132q70-16 140 0v160H80Z" fill="${color}" opacity="${base.id==='sparkling'?'.78':'1'}"/><ellipse cx="150" cy="132" rx="70" ry="10" fill="${color}"/>`;
 if(base.id==='sparkling')inside+='<g fill="#fff9e6" opacity=".9"><circle cx="111" cy="154" r="6"/><circle cx="174" cy="180" r="5"/><circle cx="135" cy="232" r="4"/><circle cx="188" cy="223" r="6"/><circle cx="142" cy="165" r="3"/></g>';
 if(base.id==='slush')inside+='<g fill="#fff9ec" opacity=".6"><path d="m100 145 18-4 6 15-17 7Zm53 26 16-7 9 15-21 6Zm27-30 16 1-2 18-16-2Z"/></g>';
 }
 if(topping){const places=[[116,250],[139,257],[164,256],[184,246],[128,235],[154,237],[174,227]];
 inside+=places.map(([x,y],i)=>topping.id==='pearls'?`<circle cx="${x}" cy="${y}" r="9" fill="#6d4b38" stroke="#51382c" stroke-width="2"/>`:topping.id==='jelly'?`<rect x="${x-7}" y="${y-6}" width="16" height="14" rx="3" transform="rotate(${i%2?12:-15} ${x} ${y})" fill="#fff1cf" stroke="#b29970" stroke-width="2"/>`:`<ellipse cx="${x}" cy="${y}" rx="6" ry="10" transform="rotate(${i%2?25:-25} ${x} ${y})" fill="#a7736b" stroke="#7b514b" stroke-width="2"/>`).join('');}
 let decoration='';
 if(finish?.id==='foam')decoration='<path d="M79 101q-7-17 10-21 4-19 22-14 12-18 29-7 21-12 32 5 22-6 26 13 22-2 23 23-13 12-27 5-17 12-35 3-18 13-37 1-24 11-43-8Z" fill="#fff7e3" stroke="#654936" stroke-width="4" stroke-linejoin="round"/>';
 if(finish?.id==='ice-cream')decoration='<path d="M89 101q-14-23 9-36-1-29 27-32 27-19 44 8 28-3 34 22 27 11 11 38Z" fill="#f3d6ad" stroke="#654936" stroke-width="4"/><path d="M113 71q15-10 26 3m25-20q10 1 15 8" fill="none" stroke="#c8a67e" stroke-width="3" stroke-linecap="round"/>';
 if(finish?.id==='lemon')decoration='<g transform="rotate(21 213 86)"><path d="M178 80a35 35 0 0 0 70 0Z" fill="#ebc76e" stroke="#654936" stroke-width="4"/><path d="M185 83a28 28 0 0 0 56 0Z" fill="#fff1bb" stroke="#cbac63" stroke-width="2"/><path d="m213 83-19 18m19-18v26m0-26 19 18" stroke="#d4b56a" stroke-width="2.5"/></g>';
 const svg=document.getElementById('drink-illustration');svg.innerHTML=`<defs><clipPath id="cup-clip"><path d="M81 103 104 261q46 23 92 0l23-158Z"/></clipPath></defs><ellipse cx="150" cy="289" rx="84" ry="10" fill="#d7c3a6" opacity=".35"/><path d="M77 93 101 265q49 25 98 0l24-172Z" fill="#fffaf0" stroke="#654936" stroke-width="5" stroke-linejoin="round"/><g clip-path="url(#cup-clip)" class="liquid-change">${inside}</g><path d="m92 118 17 124" fill="none" stroke="#fffdf4" stroke-width="7" stroke-linecap="round" opacity=".75"/><ellipse cx="150" cy="93" rx="73" ry="17" fill="${base?color:'#fff9ec'}" stroke="#654936" stroke-width="5"/>${finish?.id==='ice-cream'||finish?.id==='foam'?'':'<path d="m165 88 20-57" fill="none" stroke="#654936" stroke-width="16" stroke-linecap="round"/><path d="m165 88 20-57" fill="none" stroke="#d4a47b" stroke-width="9" stroke-linecap="round"/>'}${decoration}<circle cx="150" cy="200" r="23" fill="#fff9e9" stroke="#b69570" stroke-width="2"/><path d="M141 206q-9-10 0-17 6-3 9 4 4-7 10-4 9 7 0 17l-10 8Z" fill="#c6cda8" stroke="#7e8b64" stroke-width="2"/>${finished?'<path class="result-star" d="m63 143 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Zm171 66 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z"/>':''}`;
 svg.setAttribute('aria-label',base?`${flavor?.name||''} ${base.name}${topping?' with '+topping.name:''}${finish?' and '+finish.name:''}`.trim():'An empty cup ready for your choices');
 document.getElementById('stage-note').textContent=base?(flavor?`${flavor.name} + ${base.name}`:base.name):'Something lovely starts here.';
}
function render(){
 document.getElementById('app').classList.toggle('finished',finished);
 document.querySelectorAll('.player').forEach((player,index)=>{const active=!finished&&stages[step].owner===index;player.classList.toggle('active',active);player.querySelector('.player-status').textContent=finished?'Made together':active?'Your turn':'Up next'});
 const progress=document.querySelector('.steps');progress.replaceChildren();
 stages.forEach((stage,index)=>{if(index){const line=document.createElement('span');line.className='step-line';progress.append(line)}const item=document.createElement('span');item.className='step'+(finished||index<step?' complete':index===step?' current':'');if(index===step&&!finished)item.setAttribute('aria-current','step');const number=document.createElement('i');number.textContent=finished||index<step?'✓':index+1;item.append(number,document.createTextNode(stage.label));progress.append(item)});
 document.getElementById('choose').hidden=finished;document.getElementById('bottom').hidden=finished;document.getElementById('result').hidden=!finished;
 if(!finished){
  const stage=stages[step];document.getElementById('step-title').textContent=stage.title;document.getElementById('step-number').textContent=`0${step+1} / 04`;
  const options=document.getElementById('options');options.replaceChildren();
  stage.options.forEach(option=>{const button=document.createElement('button');button.type='button';button.className='option';button.dataset.option=option.id;button.setAttribute('aria-pressed',String(choices[step]===option.id));button.innerHTML=icon(option.id);const label=document.createElement('span');label.className='option-name';label.textContent=option.name;button.append(label);if(choices[step]===option.id){const tick=document.createElement('span');tick.className='selection-tick';tick.textContent='✓';tick.setAttribute('aria-hidden','true');button.append(tick)}button.onclick=()=>{choices[step]=option.id;render();document.querySelector(`[data-option="${option.id}"]`).focus({preventScroll:true})};options.append(button)});
  document.getElementById('next').disabled=!choices[step];document.getElementById('next-label').textContent=step===3?'Finish together':'Add & pass';document.getElementById('turn-caption').textContent=stage.caption;
 }else{
  document.getElementById('result-title').textContent=selected(1).name+' '+selected(0).name;const recipe=document.getElementById('recipe');recipe.replaceChildren();choices.forEach((_,index)=>{const chip=document.createElement('span');chip.textContent=selected(index).name;recipe.append(chip)});
 }
 drawDrink();
}
document.getElementById('next').onclick=()=>{if(finished||!choices[step])return;if(step<3)step++;else finished=true;render();document.getElementById('announcement').textContent=finished?'Your drink is ready.':stages[step].caption;if(finished)document.getElementById('restart').focus({preventScroll:true});else document.querySelector('.option').focus({preventScroll:true})};
document.getElementById('restart').onclick=()=>{choices.fill(null);step=0;finished=false;render();document.getElementById('announcement').textContent='A new drink is ready to begin.'};
render();
</script>
</body>
</html>
