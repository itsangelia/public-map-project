<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fish Together · Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d7d0bd;color:#594834;font-family:Georgia,serif}button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ac817a;outline-offset:3px}[hidden]{display:none!important}.app{height:100svh;max-width:480px;margin:auto;padding:14px 16px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;background:#eee5d2;position:relative;overflow:hidden}.top{display:grid;grid-template-columns:36px 1fr 36px;gap:10px;align-items:center}.back{display:grid;place-items:center;border:2px solid #6c5942;border-radius:50%;width:36px;height:36px;background:#f8eed9;color:inherit;text-decoration:none;font-size:27px}h1{margin:0;padding:10px;text-align:center;font-size:25px;border:3px solid #6c5942;border-radius:12px;background:#d9c3a2;box-shadow:0 2px #a28b6b}.roles{display:flex;gap:10px}.role{flex:1;border:2px solid #88775b;background:#f6eddc;border-radius:9px;padding:9px 4px;font-size:15px}.role[aria-pressed=true]{background:#b6c2a2;border-color:#6c5942}.role small{display:block;font:11px Arial,sans-serif;margin-top:4px;color:#756b53}.board{flex:1;min-height:0;position:relative;border:3px solid #78684e;border-radius:34px 30px 37px 29px;overflow:hidden;background:#b9cbb7}.pond{width:100%;height:100%;display:block;touch-action:none}.meter{position:absolute;right:12px;top:15%;bottom:15%;width:18px;border:2px solid #71694c;border-radius:12px;background:#f3e7ce;overflow:hidden}.meter-fill{position:absolute;bottom:0;width:100%;height:20%;background:#9aac7e;transition:height .1s linear}.meter.catching .meter-fill{background:#899d6a}.controls{border:2px solid #8c795a;border-radius:15px;background:#f8eedb;padding:12px}.controls-head{text-align:center;min-height:20px;font-size:14px;margin-bottom:8px}.arrows{display:flex;justify-content:center;gap:22px}.arrow{height:61px;width:87px;border:3px solid #786248;border-radius:14px;background:#e7d7b9;box-shadow:0 3px #c6b08e;font:30px Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}.arrow:active,.arrow.held{background:#bbc6a6;box-shadow:none;transform:translateY(2px)}.hint{font-size:12px;text-align:center;color:#7e735e;margin:0;min-height:15px}.preview{font:9px Arial,sans-serif;letter-spacing:1px;color:#8d7e67;text-align:center}.result{position:absolute;inset:0;z-index:2;background:#eee5d2ed;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center}.result h2{font-size:29px;margin:12px 0}.result p{margin:0 0 24px;font-size:15px}.result svg{width:170px;max-height:160px}.map{display:block;background:#c8998c;border:3px solid #6c5942;border-radius:18px;padding:13px 24px;text-decoration:none;color:#fff8e7;font-weight:bold}.again{margin-top:15px;border:0;background:none;font-size:13px;text-decoration:underline;color:#796a52}.lily{fill:#a2b58d;stroke:#78875e;stroke-width:2}.ripples{fill:none;stroke:#dce5cf;stroke-width:2;opacity:.65}.fish{fill:#d7a38e;stroke:#735e47;stroke-width:2.5;stroke-linejoin:round}.fin{fill:#bc917c;stroke:#735e47;stroke-width:2}.float-ring{fill:#f9efd512;stroke:#f8eed9;stroke-width:2.5;stroke-dasharray:5 5}.on-target .float-ring{fill:#f1e7b93b;stroke:#f7eccb;stroke-dasharray:none}.float-ripple{fill:none;stroke:#f4ead3;stroke-width:2;opacity:.8}
@media(max-height:650px){.app{gap:8px;padding-top:9px}h1{font-size:21px;padding:7px}.role{padding:6px}.controls{padding:8px}.arrow{height:48px;width:76px}.controls-head{font-size:13px;margin-bottom:5px}.hint{font-size:11px}.preview{font-size:8px}}@media(min-width:600px){.app{height:850px;max-height:calc(100svh - 32px);margin:16px auto;border:2px solid #8c795a;border-radius:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.result[data-outcome="escaped"] .again{background:#c8998c;border:2px solid #6c5942;border-radius:12px;color:#fff8e7;text-decoration:none;padding:12px 22px;font-size:16px}
.target-ripple{fill:none;stroke:#edf2df;stroke-width:2.5;stroke-linecap:round}.outer-ripple{opacity:.55;animation:water-breathe 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes water-breathe{50%{opacity:.25;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.outer-ripple{animation:none}}.catch-art{width:min(280px,80vw);aspect-ratio:1.1;background-repeat:no-repeat;background-position:center;background-size:contain}.catch-art[data-catch="0"],.catch-art[data-catch="1"]{background-image:url('fishing-catch-sheet.png');background-size:300% 220%;background-color:#fffdf2}.catch-art[data-catch="0"]{background-position:50% 17%}.catch-art[data-catch="1"]{background-position:100% 100%}.catch-art[data-catch="2"]{background-image:url('fishing-catch-big-mouth.png')}.catch-art[data-catch="3"]{background-image:url('fishing-catch-cat.png')}.catch-art[data-catch="escaped"]{background-image:url('fishing-escaped.png')}
.catch-art[data-catch]{background-image:none;background-color:transparent}.catch-art{mix-blend-mode:multiply}.catch-art svg{width:100%;height:100%;max-height:none}
</style></head><body>
<main class="app"><header class="top"><a class="back" aria-label="Back to map" href="https://itsangelia.github.io/public-map-project/campus-0375db001d569553.html?room=campus">‹</a><h1>Fish Together</h1><span></span></header>
<nav class="roles" aria-label="Local role preview"><button class="role" data-role="a" aria-pressed="true">Player A · ↕<small>Up &amp; down</small></button><button class="role" data-role="b" aria-pressed="false">Player B · ↔<small>Left &amp; right</small></button></nav>
<section class="board" aria-label="Cooperative fishing pond"><svg class="pond" viewBox="0 0 360 440" preserveAspectRatio="none" role="img" aria-label="Move the float over the ripples"><defs><pattern id="water" width="115" height="100" patternUnits="userSpaceOnUse"><path d="M12 28q14 7 28 0m34 43q13 7 25 0" class="ripples"/></pattern></defs><rect width="360" height="440" fill="#b9cbb7"/><rect width="360" height="440" fill="url(#water)"/><path d="M-7 0H366v20q-40 0-52-10-33 15-65 1-40 11-65-1-42 14-78 0-30 13-57 0-27 13-56 10Z" fill="#cdd2af" stroke="#9a9f79" stroke-width="2"/><path d="M0 410q32-6 52 8 34-12 62 1 35-11 63 0 28-10 62-1 28-12 59 0 30-10 62-9v31H0Z" fill="#cdd2af" stroke="#9a9f79" stroke-width="2"/>
<path class="lily" d="M21 77a23 20 0 1 1 28 17L42 77Z"/><path class="lily" d="M288 362a23 20 0 1 1 28 17l-7-17Z"/><path d="M34 46q-7-13 2-18 13-1 10 15-2 8-12 3Z" fill="#d9b3aa" stroke="#a98a7c" stroke-width="2"/>
<g id="fish" transform="translate(180 180)" aria-label="Fish ripples"><g id="fish-facing"><ellipse rx="29" ry="13" fill="#dce8d3" opacity=".2"/><ellipse class="target-ripple" rx="25" ry="11"/><ellipse class="target-ripple outer-ripple" rx="35" ry="17"/><path d="M-12-2q12 8 24 0" class="target-ripple"/></g></g>
<g id="float" transform="translate(180 265)"><circle class="float-ring" r="39.6"/><ellipse class="float-ripple" cy="1" rx="21" ry="7"/><path d="M0-27v13" stroke="#685844" stroke-width="3" stroke-linecap="round"/><path d="M-11 0v-3c0-17 22-17 22 0v3Z" fill="#be8f85" stroke="#685844" stroke-width="2.5"/><path d="M-10-3h20v3h-20Z" fill="#f8eed7"/><path d="M-14 1q14 5 28 0" fill="none" stroke="#f4ead3" stroke-width="3" stroke-linecap="round"/></g></svg>
<div class="meter" role="progressbar" aria-label="Catch progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"><div class="meter-fill"></div></div></section>
<section class="controls"><div class="controls-head" id="role-label">Player A · Up &amp; down</div><div class="arrows"><button class="arrow" data-direction="-1" aria-label="Move up">↑</button><button class="arrow" data-direction="1" aria-label="Move down">↓</button></div></section>
<p class="hint" role="status" id="status">Keep the float over the ripples.</p><div class="preview">LOCAL INTERACTION PREVIEW · SWITCH A / B ABOVE</div>
<section class="result" hidden aria-label="Catch complete"><div class="catch-art" role="img" aria-label="Your catch"></div><h2>Caught together!</h2><p>A little teamwork, a lovely catch.</p><a class="map" href="https://itsangelia.github.io/public-map-project/campus-0375db001d569553.html?room=campus">Back to map →</a><button class="again">Try again</button></section></main>
<script>
// Local mechanics/style preview only. No Firebase, matchmaking or shared state.
const settings={speed:115,catchRadius:39.6,catchSeconds:10,initialProgress:.2,missDecay:.04,fishMoveSeconds:3.5};
const state={role:'a',float:{x:180,y:265},fish:{x:180,y:180},target:{x:180,y:180},progress:settings.initialProgress,untilMove:settings.fishMoveSeconds,complete:false,outcome:null};
let direction=0,pointer=null,last=performance.now();
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function release(){direction=0;pointer=null;document.querySelectorAll('.arrow').forEach(b=>b.classList.remove('held'));}
function setRole(role){release();state.role=role;document.querySelectorAll('.role').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===role)));document.getElementById('role-label').textContent=role==='a'?'Player A · Up & down':'Player B · Left & right';document.querySelectorAll('.arrow').forEach(b=>{const negative=b.dataset.direction==='-1';b.textContent=role==='a'?(negative?'↑':'↓'):(negative?'←':'→');b.setAttribute('aria-label','Move '+(role==='a'?(negative?'up':'down'):(negative?'left':'right')));});}
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
document.querySelectorAll('.arrow').forEach(b=>{b.onpointerdown=e=>{if(state.complete||pointer!==null)return;e.preventDefault();pointer=e.pointerId;direction=Number(b.dataset.direction);b.classList.add('held');b.setPointerCapture(e.pointerId);};for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,release);});
window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{release();last=performance.now();});
window.addEventListener('keydown',e=>{if(e.target.closest('a')||state.complete)return;if((e.key===' '||e.key==='Enter')&&e.target.matches('.arrow')){e.preventDefault();direction=Number(e.target.dataset.direction);return;}const allowed=state.role==='a'?['ArrowUp','ArrowDown']:['ArrowLeft','ArrowRight'];if(allowed.includes(e.key)){e.preventDefault();direction=e.key===allowed[0]?-1:1;}});window.addEventListener('keyup',release);
function finish(outcome,catchKey=String(Math.random())){
 state.complete=true;state.outcome=outcome;release();
 const result=document.querySelector('.result'),success=outcome==='caught';
 result.hidden=false;result.dataset.outcome=outcome;result.setAttribute('aria-label',success?'Catch complete':'Catch failed');
 const art=result.querySelector('.catch-art');
 // Stable round identity gives both players the same reveal without extra writes.
 const hash=Array.from(catchKey).reduce((h,c)=>Math.imul(h^c.charCodeAt(0),16777619)>>>0,2166136261);
 const choice=hash%4;art.dataset.catch=success?String(choice):'escaped';
 art.setAttribute('aria-label',success?['Lotus fish','Toothy fish','Big-mouth fish','Cat fish'][choice]:'The escaped fish');
 const crops=[['fishing-catch-sheet.png','530 110 480 400',1536,1024],['fishing-catch-sheet.png','1030 610 490 385',1536,1024],['fishing-catch-big-mouth.png','60 170 1170 880',1254,1254],['fishing-catch-cat.png','90 440 1090 510',1254,1254]];
 const [file,box,width,height]=success?crops[choice]:['fishing-escaped.png','80 260 1180 750',1286,1223];
 // Crop only the viewport; keep the uploaded image bytes unchanged.
 const [cx,cy,cw,ch]=box.split(' ');art.innerHTML=`<svg viewBox="${box}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><clipPath id="catch-crop"><rect x="${cx}" y="${cy}" width="${cw}" height="${ch}"/></clipPath></defs><image clip-path="url(#catch-crop)" href="${file}" width="${width}" height="${height}"/></svg>`;

 result.querySelector('h2').textContent=success?'Caught together!':'The fish got away!';
 result.querySelector('p').textContent=success?'A little teamwork, a lovely catch.':'Try again together.';
 result.querySelector(success?'.map':'.again').focus({preventScroll:true});
}
function tick(dt){
 if(state.complete)return;
 const axis=state.role==='a'?'y':'x';state.float[axis]=clamp(state.float[axis]+direction*settings.speed*dt,45,axis==='x'?305:390);
 state.untilMove-=dt;if(state.untilMove<=0){state.target={x:55+Math.random()*230,y:60+Math.random()*320};state.untilMove=settings.fishMoveSeconds;}
 const amount=1-Math.exp(-dt*8);state.fish.x+=(state.target.x-state.fish.x)*amount;state.fish.y+=(state.target.y-state.fish.y)*amount;
 const aligned=Math.hypot(state.float.x-state.fish.x,state.float.y-state.fish.y)<=settings.catchRadius;
 state.progress=clamp(state.progress+(aligned?dt/settings.catchSeconds:-dt*settings.missDecay),0,1);
 if(state.progress>=1-1e-9){state.progress=1;finish('caught');}
 else if(state.progress<=1e-9){state.progress=0;finish('escaped');}
 draw(aligned);
}
function draw(aligned=false){document.getElementById('float').setAttribute('transform',`translate(${state.float.x} ${state.float.y})`);document.getElementById('float').classList.toggle('on-target',aligned);document.getElementById('fish').setAttribute('transform',`translate(${state.fish.x} ${state.fish.y})`);document.getElementById('fish-facing').setAttribute('transform',state.target.x<state.fish.x?'scale(-1 1)':'scale(1 1)');document.querySelector('.meter-fill').style.height=state.progress*100+'%';document.querySelector('.meter').setAttribute('aria-valuenow',Math.round(state.progress*100));document.querySelector('.meter').classList.toggle('catching',aligned);document.getElementById('status').textContent=state.complete?(state.outcome==='caught'?'Caught together!':'The fish got away'):aligned?'Stay together…':'Keep the float over the ripples.';}
document.querySelector('.again').onclick=()=>{release();Object.assign(state,{float:{x:180,y:265},fish:{x:180,y:180},target:{x:180,y:180},progress:settings.initialProgress,untilMove:settings.fishMoveSeconds,complete:false,outcome:null});document.querySelector('.result').hidden=true;delete document.querySelector('.result').dataset.outcome;last=performance.now();draw();};
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!document.hidden)tick(dt);requestAnimationFrame(frame);}draw();requestAnimationFrame(frame);
</script></body></html>
