<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wishing Tree</title><style>
:root{--ink:#303a68;--paper:#fffaf0;--green:#dce5ce;--outline:#756951}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f4f0e6;font:15px Arial,sans-serif}button,input,textarea{font:inherit}button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #7c89d9;outline-offset:4px}.app{height:100dvh;overflow:auto;max-width:1100px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:linear-gradient(#fff9ef,#eef1df 75%,#e5ebd8)}.heading{display:grid;grid-template-columns:52px 1fr 70px;align-items:center;padding:18px 20px 10px;gap:10px}.back,.close{border:1px solid #ded8c9;background:#fffcf3;color:var(--ink);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;text-decoration:none;font-size:24px}.title{text-align:center}.title h1{margin:0;font:700 27px Georgia,serif}.title p{margin:7px 0 0;color:#7a7b66;font:italic 14px Georgia,serif}.count{font-size:12px;text-align:center;color:#777b68;line-height:1.5}.stage{flex-shrink:1;position:relative;flex:1;min-height:420px;display:flex;align-items:center;justify-content:center;overflow:clip;background:radial-gradient(ellipse at 50% 80%,#cbd8af70,transparent 58%)}.scene{position:relative;width:min(880px,95vw);aspect-ratio:3/2;flex-shrink:0}.tree{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.notes{position:absolute;inset:0}.wish-note{--angle:0deg;position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%) rotate(var(--angle));width:clamp(48px,7.5vw,70px);height:clamp(67px,10vw,96px);padding:17px 7px 7px;border:1.5px solid #756951;border-radius:3px 3px 9px 4px;background:var(--tint,#fff1ce);box-shadow:2px 3px 0 #6151391a;color:#5b5144;display:flex;flex-direction:column;justify-content:space-between;text-align:center;transform-origin:50% -21px;transition:filter .15s,box-shadow .15s}.wish-note:before{content:'';position:absolute;left:50%;bottom:100%;height:21px;border-left:1.5px solid #806a4f}.wish-note:after{content:'';position:absolute;left:calc(50% - 3px);top:5px;width:6px;height:6px;border-radius:50%;background:#b8806c}.wish-note:hover{filter:brightness(1.04);box-shadow:2px 5px 6px #61513930}.wish-note .excerpt{font:12px/1.3 Georgia,serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.wish-note .author{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}.wish-note.inviting{animation:wish-sway 2.4s ease-in-out var(--sway-delay,0s) 2}.wish-note.just-hung{animation:hang .6s ease-out,wish-sway 2.4s ease-in-out .6s 2}.wish-note:hover,.wish-note:focus-visible{animation-play-state:paused}@keyframes wish-sway{0%,100%{transform:translate(-50%,-50%) rotate(var(--angle))}25%{transform:translate(-50%,-50%) rotate(calc(var(--angle) + 3deg))}75%{transform:translate(-50%,-50%) rotate(calc(var(--angle) - 3deg))}}@keyframes hang{0%{opacity:0;transform:translate(-50%,-80%) rotate(-12deg)}70%{transform:translate(-50%,-50%) rotate(5deg)}100%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle))}}.actions{margin:0 20px 12px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fffaf0e6;border:1px solid #ded8c9;border-radius:22px}.pager{display:flex;align-items:center;gap:8px}.pager button{width:40px;height:44px;border:0;background:transparent;border-radius:10px;font-size:23px;color:var(--ink)}button:disabled{opacity:.3;cursor:default}.page-label{font-size:12px;white-space:nowrap}.primary{border:1px solid #303a68;border-radius:14px;min-height:46px;padding:10px 18px;background:#303a68;color:white;font-weight:bold;display:inline-flex;gap:9px;align-items:center;justify-content:center}.primary svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}.preview-note{min-height:28px;margin:0;padding:0 20px max(12px,env(safe-area-inset-bottom));text-align:center;color:#747b68;font-size:11px;line-height:1.5}dialog{width:min(440px,calc(100vw - 28px));max-height:calc(100dvh - 28px);overflow:auto;margin:auto;border:1px solid #bcb09a;border-radius:22px;padding:24px;background:#fff9ed;color:var(--ink);box-shadow:0 12px 40px #303a682b}dialog::backdrop{background:#35433d66}dialog .dialog-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}dialog h2{margin:0;font:700 23px Georgia,serif}.close{width:36px;height:36px;font-size:24px;flex-shrink:0}#read-paper{background:#fff8e8}#wish-text{margin:8px 0 25px;min-height:150px;font:19px/32px Georgia,serif;color:#5b5144;white-space:pre-wrap;overflow-wrap:anywhere;background:repeating-linear-gradient(transparent 0 31px,#dbd2b14d 31px 32px)}.signature{text-align:right;font:italic 17px Georgia,serif;color:#777457}.signature strong{display:inline-block;margin-top:8px;color:#4c5666;font-style:normal}.small-label{display:block;color:#737767;font-size:12px;margin:12px 0 7px}input,textarea{width:100%;border:1px solid #d5ccb9;background:#fffdf7;color:#4c4f48;border-radius:10px;padding:11px;font-size:16px}textarea{resize:vertical;min-height:156px;line-height:1.7;font-family:Georgia,serif}input:focus,textarea:focus{outline:2px solid #a5b68c;outline-offset:2px}.editor-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.remaining{font-size:12px;color:#797c6b}.form-error{font-size:12px;color:#a44242;min-height:16px;margin:8px 0 0}#announcement{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);border-radius:12px;background:#303a68;color:white;padding:10px 16px;font-size:13px;z-index:10}#announcement:empty{display:none}@media(max-width:600px){.heading{padding:16px 12px 6px;grid-template-columns:44px 1fr 54px;gap:6px}.title h1{font-size:24px}.title p{font-size:12px}.stage{min-height:280px}.scene{width:124vw;max-width:640px}.wish-note{width:52px;height:74px;padding:15px 5px 6px}.wish-note .excerpt{font-size:11px}.wish-note .author{font-size:9px}.actions{margin:0 12px 10px;padding:10px}.primary{padding:10px 14px;font-size:14px}.pager{gap:4px}dialog{padding:20px}.preview-note{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Reading card follows the reference's pinned green message-board treatment. */
#read-paper{width:min(430px,calc(100vw - 32px));padding:0 11px 5px;background:#dce8ad;border:3px solid #b7c17b;border-radius:4px;box-shadow:0 5px 0 #7d8b5140,0 12px 35px #303a6826;overflow:visible}
#read-paper .card-name{position:relative;display:flex;align-items:center;justify-content:center;min-height:39px;margin:0;padding:5px 30px;font:700 15px Arial,sans-serif;color:#975d8a;text-align:center;overflow-wrap:anywhere}
#read-paper .close{position:absolute;top:3px;right:-5px;width:32px;height:32px;min-height:32px;border:0;border-radius:50%;background:transparent;color:#6e7950;font-size:23px}
#read-paper .card-message{position:relative;min-height:170px;max-height:55dvh;overflow:auto;background:#fffefa;border:4px solid #f4f4d7;overscroll-behavior:contain}
#read-paper #wish-text{position:relative;z-index:1;margin:0;padding:12px 11px;min-height:162px;background:none;color:#6d6771;font:16px/1.75 Arial,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
#read-paper .clover{position:absolute;right:8px;bottom:6px;width:125px;height:125px;color:#b9c99c;opacity:.12;pointer-events:none}
#read-paper .card-footer{min-height:29px;padding:7px 1px 0;text-align:left;font:12px Arial,sans-serif;color:#a1648c}
.wood-pin{position:absolute;z-index:3;width:9px;height:18px;background:#ad7950;border:1px solid #805a37;border-radius:3px;box-shadow:1px 1px 1px #5c4b2c26;pointer-events:none}
.wood-pin:after{content:'';position:absolute;top:2px;left:2px;bottom:2px;border-left:1px solid #d1a16f}
.wood-pin.top-left{left:-5px;top:-8px;transform:rotate(-33deg)}.wood-pin.top-right{right:-5px;top:-8px;transform:rotate(33deg)}.wood-pin.bottom-left{left:-5px;bottom:-8px;transform:rotate(33deg)}.wood-pin.bottom-right{right:-5px;bottom:-8px;transform:rotate(-33deg)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style></head><body><div class="app"><header class="heading"><a class="back" href="#" aria-label="Back to map">‹</a><div class="title"><h1>Wishing Tree</h1><p>A little hope, shared.</p></div><div class="count" id="wish-count"></div></header><main class="stage"><div class="scene"><img class="tree" src="wishing-tree.png" alt="Wishing Tree"><div class="notes" id="notes" aria-label="Wishes hanging on the tree"></div></div></main><div class="actions"><div class="pager"><button id="previous" aria-label="Previous wishes">‹</button><span class="page-label" id="page-label"></span><button id="next" aria-label="Next wishes">›</button></div><button class="primary" id="write"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L21 7l-4-4Z M14 6l4 4"/></svg>Write a wish</button></div><p class="preview-note"></p></div>
<dialog id="read-paper" aria-labelledby="read-title"><span class="wood-pin top-left" aria-hidden="true"></span><span class="wood-pin top-right" aria-hidden="true"></span><span class="wood-pin bottom-left" aria-hidden="true"></span><span class="wood-pin bottom-right" aria-hidden="true"></span><h2 id="read-title" class="sr-only">Player wish</h2><header class="card-name"><strong id="wish-author"></strong><button class="close" data-close="read-paper" aria-label="Close wish">×</button></header><div class="card-message"><svg class="clover" viewBox="0 0 120 120" aria-hidden="true"><g fill="currentColor"><ellipse cx="47" cy="35" rx="15" ry="23" transform="rotate(-35 47 35)"/><ellipse cx="78" cy="38" rx="15" ry="23" transform="rotate(35 78 38)"/><ellipse cx="42" cy="69" rx="15" ry="23" transform="rotate(-130 42 69)"/><ellipse cx="77" cy="71" rx="15" ry="23" transform="rotate(130 77 71)"/></g><path d="M62 64q8 26-3 43" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><p id="wish-text"></p></div><footer class="card-footer"><time id="wish-date"></time></footer></dialog>
<dialog id="compose" aria-labelledby="compose-title"><form id="wish-form"><div class="dialog-header"><h2 id="compose-title">Make a wish</h2><button class="close" type="button" data-close="compose" aria-label="Close editor">×</button></div><label class="small-label" for="nickname">Nickname</label><input id="nickname" name="nickname" maxlength="18" readonly value="Guest" autocomplete="off"><label class="small-label" for="message">Your wish</label><textarea id="message" name="message" maxlength="160" required placeholder="I hope…"></textarea><p class="form-error" id="form-error" role="alert"></p><div class="editor-footer"><span class="remaining" id="remaining">0 / 160</span><button class="primary" type="submit">Hang wish<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18 18 5M7 5h11v11"/></svg></button></div></form></dialog><div id="announcement" role="status" aria-live="polite"></div>
<script>
// Shared backend access is owned by the parent map; no second login or connection.
const previewDate=Date.now();
function wishDate(timestamp){const parts=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Perth',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date(timestamp));const get=type=>parts.find(part=>part.type===type).value;return get('year')+'.'+get('month')+'.'+get('day')}
let wishes=[];
const network=window.parent.mapNetwork;
// Keep the invitation short while leaving the original wish untouched.
function wishExcerpt(value){
 const text=String(value).trim().replace(/\s+/gu,' ');
 const graphemes=typeof Intl.Segmenter==='function'
  ? [...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(text)].map(part=>part.segment)
  : Array.from(text);
 const limit=/[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}]/u.test(text)?8:40;
 let opening=graphemes.slice(0,limit).join('');
 const words=text.split(' ');
 // Leave the ending hidden even when a wish is exactly five words long.
 if(words.length>2){const count=Math.min(5,words.length-1);const firstWords=words.slice(0,count).join(' ');if(firstWords.length<opening.length)opening=firstWords}
 opening=opening.trimEnd();
 return opening+(opening.length<text.length?'…':'');
}
const invitedWishIds=new Set();
const slots=[{x:22,y:64,a:-6,t:'#fff0cb'},{x:39,y:48,a:5,t:'#f5dfd5'},{x:78,y:54,a:-4,t:'#e9ecd4'},{x:79,y:75,a:6,t:'#fff0cb'},{x:51,y:33,a:-3,t:'#e2e9ee'},{x:62,y:55,a:5,t:'#f5dfd5'}];
let page=0,newId=null,toastTimer,pendingId=null,sending=false;
const notes=document.getElementById('notes'),read=document.getElementById('read-paper'),compose=document.getElementById('compose'),message=document.getElementById('message'),nickname=document.getElementById('nickname');
function render(){
const pages=Math.max(1,Math.ceil(wishes.length/slots.length));page=Math.min(page,pages-1);notes.replaceChildren();
wishes.slice(page*slots.length,(page+1)*slots.length).forEach((wish,index)=>{const slot=slots[index],button=document.createElement('button');button.className='wish-note'+(wish.id===newId?' just-hung':!invitedWishIds.has(wish.id)?' inviting':'');invitedWishIds.add(wish.id);button.style.setProperty('--sway-delay',(index*.14)+'s');button.type='button';button.style.setProperty('--x',slot.x+'%');button.style.setProperty('--y',slot.y+'%');button.style.setProperty('--angle',slot.a+'deg');button.style.setProperty('--tint',slot.t);button.setAttribute('aria-label','Read wish by '+wish.name);const excerpt=document.createElement('span');excerpt.className='excerpt';excerpt.textContent=wishExcerpt(wish.text);const author=document.createElement('span');author.className='author';author.textContent=wish.name;button.append(excerpt,author);button.addEventListener('click',()=>{document.getElementById('wish-text').textContent=wish.text;document.getElementById('wish-author').textContent=wish.name;document.getElementById('wish-date').textContent=wishDate(wish.createdAt||previewDate);document.getElementById('wish-date').dateTime=new Date(wish.createdAt||previewDate).toISOString();read.showModal()});notes.append(button)});
document.getElementById('wish-count').textContent=wishes.length+' wishes';document.getElementById('page-label').textContent=(page+1)+' / '+pages;document.getElementById('previous').disabled=page===0;document.getElementById('next').disabled=page===pages-1;newId=null;
}
document.getElementById('previous').onclick=()=>{page--;newId=null;render()};document.getElementById('next').onclick=()=>{page++;newId=null;render()};
document.getElementById('write').onclick=()=>{nickname.value=network.state.players[network.ownKey]?.nickname||'Guest';document.getElementById('form-error').textContent='';compose.showModal();message.focus()};
document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>document.getElementById(button.dataset.close).close());
message.addEventListener('input',()=>{document.getElementById('remaining').textContent=message.value.length+' / 160';document.getElementById('form-error').textContent=''});
nickname.addEventListener('input',()=>document.getElementById('form-error').textContent='');
document.querySelector('.back').onclick=event=>{event.preventDefault();window.parent.wishingTree.close()};
const status=document.querySelector('.preview-note');
function connectionStatus(){if(!network.state.connected){status.textContent=sending?'Reconnecting… Your wish is waiting to be saved.':'Reconnecting…';}else if(!status.dataset.error){status.textContent=wishes.length?'':'Be the first to hang a wish.'}}
window.parent.addEventListener('map-connection-updated',connectionStatus);
window.addEventListener('pagehide',()=>window.parent.removeEventListener('map-connection-updated',connectionStatus));
try {
 const unsubscribe=network.subscribeWishes(values=>{wishes=values;delete status.dataset.error;render();connectionStatus()},error=>{status.dataset.error='true';status.textContent=error.message;document.getElementById('write').disabled=true});
 window.disposeWishingTree=()=>{unsubscribe?.();window.parent.removeEventListener('map-connection-updated',connectionStatus)};
 window.addEventListener('pagehide',window.disposeWishingTree,{once:true});
} catch(error){status.textContent=error.message;document.getElementById('write').disabled=true}
document.getElementById('wish-form').addEventListener('submit',async event=>{
 event.preventDefault();if(sending)return;
 const text=message.value.trim();if(!text||text.length>160){document.getElementById('form-error').textContent='Please write a wish (1–160 characters).';return}
 pendingId ||= network.createWishId();sending=true;
 const submit=event.submitter||document.querySelector('[type=submit]');submit.disabled=true;message.readOnly=true;
 document.querySelector('[data-close=compose]').disabled=true;
 try {
  await network.sendWish(text,pendingId);
  newId=pendingId;pendingId=null;page=0;render();compose.close();message.value='';
  document.getElementById('remaining').textContent='0 / 160';
  document.getElementById('announcement').textContent='Your wish is on the tree.';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('announcement').textContent='',2500);
 } catch(error){document.getElementById('form-error').textContent=error.message;pendingId=null}
 finally{sending=false;submit.disabled=false;message.readOnly=false;document.querySelector('[data-close=compose]').disabled=false;connectionStatus()}
});
compose.addEventListener('cancel',event=>{if(sending)event.preventDefault()});
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&!compose.open&&!read.open)window.parent.wishingTree.close()});

render();connectionStatus();
</script></body></html>
