<svg width="1660" height="840" viewBox="0 0 1660 840" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#303a68"/></marker></defs><rect x="0" y="115" width="580" height="610" rx="20" fill="#fff" stroke="#c9c5b8" stroke-width="2"/><text x="35" y="170" font-family="Arial" font-size="24" font-weight="700" fill="#303a68">CLIENT BROWSERS</text><text x="35" y="222" font-family="Arial" font-size="37" font-weight="700" fill="#303a68">p5.js + Firebase SDK</text><rect x="35" y="260" width="228" height="180" rx="20" fill="#e4e9d6" stroke="#c9c5b8" stroke-width="2"/><rect x="288" y="260" width="255" height="180" rx="20" fill="#efddd5" stroke="#c9c5b8" stroke-width="2"/><text x="58" y="309" font-family="Arial" font-size="27" font-weight="700" fill="#303a68">Phone A / B</text><text x="58" y="355" font-family="Arial" font-size="22" font-weight="400" fill="#303a68">Nickname + avatar</text><text x="58" y="392" font-family="Arial" font-size="22" font-weight="400" fill="#303a68">Movement + actions</text><text x="311" y="309" font-family="Arial" font-size="27" font-weight="700" fill="#303a68">Public display</text><text x="311" y="355" font-family="Arial" font-size="22" font-weight="400" fill="#303a68">Shared map</text><text x="311" y="392" font-family="Arial" font-size="22" font-weight="400" fill="#303a68">Players + bubbles</text><text x="35" y="508" font-family="Arial" font-size="29" font-weight="700" fill="#303a68">One shared room: campus</text><text x="35" y="558" font-family="Arial" font-size="25" font-weight="400" fill="#303a68">World coordinates are shared.</text><text x="35" y="603" font-family="Arial" font-size="25" font-weight="400" fill="#303a68">Each screen has its own view.</text><text x="35" y="657" font-family="Arial" font-size="23" font-weight="400" fill="#303a68">Temporary identities; separate connections.</text><rect x="1030" y="35" width="630" height="290" rx="20" fill="#e4e9d6" stroke="#c9c5b8" stroke-width="2"/><text x="1060" y="94" font-family="Arial" font-size="25" font-weight="700" fill="#303a68">FIREBASE AUTHENTICATION</text><text x="1060" y="151" font-family="Arial" font-size="36" font-weight="700" fill="#303a68">Anonymous sign-in</text><text x="1060" y="202" font-family="Arial" font-size="25" font-weight="400" fill="#303a68">Provides a temporary UID and auth token.</text><text x="1060" y="249" font-family="Arial" font-size="25" font-weight="400" fill="#303a68">No visible account-registration form.</text><rect x="1030" y="435" width="630" height="345" rx="20" fill="#efddd5" stroke="#c9c5b8" stroke-width="2"/><text x="1060" y="493" font-family="Arial" font-size="25" font-weight="700" fill="#303a68">REALTIME DATABASE</text><text x="1060" y="548" font-family="Arial" font-size="35" font-weight="700" fill="#303a68">Room state + live updates</text><text x="1060" y="596" font-family="Arial" font-size="25" font-weight="400" fill="#303a68">Players / chat / wishes / activity state</text><text x="1060" y="646" font-family="Arial" font-size="23" font-weight="400" fill="#303a68">Rules validate authentication and ownership.</text><text x="1060" y="695" font-family="Arial" font-size="22" font-weight="400" fill="#303a68">Example path:</text><text x="1060" y="736" font-family="Arial" font-size="22" font-weight="700" fill="#303a68">rooms/campus/players/{uid}/{connection}</text><path d="M580 190 H1030" stroke="#303a68" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="625" y="162" font-family="Arial" font-size="25" font-weight="700" fill="#303a68">1. Anonymous sign-in</text><path d="M1030 278 H580" stroke="#303a68" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="625" y="316" font-family="Arial" font-size="25" font-weight="700" fill="#303a68">2. UID + identity token</text><path d="M580 557 H1030" stroke="#303a68" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="625" y="527" font-family="Arial" font-size="23" font-weight="700" fill="#303a68">3. Authenticated reads / writes</text><path d="M1030 655 H580" stroke="#303a68" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="625" y="694" font-family="Arial" font-size="25" font-weight="700" fill="#303a68">4. Shared state updates</text></svg>