<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wishing Tree · Map Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#303a68;font:14px Arial,sans-serif}header{min-height:68px;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;flex-wrap:wrap}strong{font-size:16px}nav{display:flex;gap:6px}button{border:1px solid #d8d4cd;border-radius:10px;padding:10px 12px;background:#fff;color:#303a68;font:inherit;cursor:pointer;min-height:40px}button[aria-pressed=true]{background:#303a68;color:white}main{position:relative;height:calc(100dvh - 108px);min-height:320px}canvas{display:block;width:100%;height:100%;touch-action:manipulation}footer{padding:10px 14px;font-size:12px;line-height:1.5}#loading{position:absolute;inset:0;display:grid;place-content:center;background:#fff8f1}#loading[hidden]{display:none}@media(max-width:600px){header{justify-content:center}strong{width:100%;text-align:center}main{height:calc(100dvh - 150px)}}

#tree-entry{position:absolute;z-index:2;border:0;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border-radius:35%;}
#tree-entry[hidden]{display:none}#tree-entry:focus-visible{outline:2px dashed #303a68;outline-offset:4px}
dialog{border:1px solid #ddd9d0;border-radius:22px;background:#fff8f1;color:#303a68;padding:24px;max-width:min(360px,calc(100vw - 32px));text-align:center;box-shadow:0 12px 40px #303a6833}dialog::backdrop{background:#303a683d}dialog h2{margin:0 0 8px}dialog img{display:block;width:220px;max-width:100%;margin:auto}dialog p{line-height:1.5;font-size:14px}dialog button{background:#303a68;color:white;border:0}
</style></head><body><header><strong>Wishing Tree · Map Preview</strong><nav><button id="overview">Full map</button><button id="close">Phone view</button><button id="compare" aria-pressed="false">Show original</button></nav></header><main><canvas id="map" aria-label="Existing map with the selected wishing tree over the central plaza tree"></canvas><button id="tree-entry" aria-label="Open Wishing Tree" hidden></button><div id="loading">Loading preview…</div></main><footer>Interaction preview only. The live multiplayer map is unchanged.</footer><dialog id="wish-entry"><h2>Wishing Tree</h2><img src="assets/wishing-tree-simple-v1.png" alt=""><p>Entrance preview. Wish writing will be added after the interaction is approved.</p><form method="dialog"><button>Back to map</button></form></dialog><script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const map=new Image(),tree=new Image();
let mode=innerWidth<700?'close':'overview',showOriginal=false,ready=false;
const entry=document.getElementById('tree-entry'),dialog=document.getElementById('wish-entry');
const outline=document.createElement('canvas');
let hover=false,pressed=false,opening=false;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
// Source artwork coordinates: cover the existing central tree, keep its flowerbed.
const placement={x:724,y:417,width:240,height:160};
map.src='../map%20draft.png';tree.src='assets/wishing-tree-simple-v1.png';
function loaded(image){return new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;if(image.complete&&image.naturalWidth)resolve()})}
function draw(){
 const box=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2);
 if(canvas.width!==Math.round(box.width*ratio)||canvas.height!==Math.round(box.height*ratio)){canvas.width=Math.round(box.width*ratio);canvas.height=Math.round(box.height*ratio)}
 ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#fff8f1';ctx.fillRect(0,0,box.width,box.height);
 document.getElementById('overview').setAttribute('aria-pressed',mode==='overview');document.getElementById('close').setAttribute('aria-pressed',mode==='close');document.getElementById('compare').setAttribute('aria-pressed',showOriginal);
 if(!ready)return;
 const scale=mode==='overview'?Math.min(box.width/map.width,box.height/map.height):box.width/(600/1.35/1.6);
 const x=mode==='overview'?(box.width-map.width*scale)/2:box.width/2-724*scale;
 const y=mode==='overview'?(box.height-map.height*scale)/2:box.height*.46-435*scale;
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.drawImage(map,0,0);
 entry.hidden=showOriginal;
 entry.style.left=`${x+(placement.x-placement.width/2)*scale}px`;
 entry.style.top=`${y+(placement.y-placement.height/2)*scale}px`;
 entry.style.width=`${placement.width*scale}px`;entry.style.height=`${placement.height*scale}px`;
 if(!showOriginal){
  const wave=reducedMotion.matches?0:(Math.sin(performance.now()/900)+1)/2;
  const active=hover||document.activeElement===entry;
  const size=pressed?.97:active?1.018:1+wave*.004;
  ctx.save();ctx.translate(placement.x,placement.y);ctx.scale(size,size);
  const edge=(active?2:1)/scale;
  ctx.save();ctx.globalAlpha=active?.8:.3+wave*.18;
  ctx.shadowColor=active?'rgba(255,223,137,.7)':'rgba(255,223,137,.3)';ctx.shadowBlur=(active?9:4+wave*3)/scale;
  for(const [dx,dy] of [[-edge,0],[edge,0],[0,-edge],[0,edge]])ctx.drawImage(outline,-placement.width/2+dx,-placement.height/2+dy,placement.width,placement.height);
  ctx.restore();
  ctx.drawImage(tree,-placement.width/2,-placement.height/2,placement.width,placement.height);
  ctx.restore();
 }
 ctx.restore();
}
Promise.all([loaded(map),loaded(tree)]).then(()=>{outline.width=480;outline.height=320;const oc=outline.getContext('2d');oc.drawImage(tree,0,0,480,320);const pixels=oc.getImageData(0,0,480,320);for(let i=0;i<pixels.data.length;i+=4){const alpha=pixels.data[i+3]>180?255:0;pixels.data[i]=40;pixels.data[i+1]=34;pixels.data[i+2]=29;pixels.data[i+3]=alpha}oc.putImageData(pixels,0,0);ready=true;document.getElementById('loading').hidden=true;draw()}).catch(()=>{document.getElementById('loading').textContent='Image could not load. Please refresh.'});
document.getElementById('overview').onclick=()=>{mode='overview';draw()};document.getElementById('close').onclick=()=>{mode='close';draw()};document.getElementById('compare').onclick=()=>{showOriginal=!showOriginal;draw()};addEventListener('resize',draw);
entry.addEventListener('pointerenter',event=>{if(event.pointerType==='mouse')hover=true});entry.addEventListener('pointerleave',()=>{hover=false;pressed=false});entry.addEventListener('pointerdown',()=>{pressed=true});entry.addEventListener('pointerup',()=>pressed=false);entry.addEventListener('pointercancel',()=>pressed=false);
entry.addEventListener('click',()=>{if(opening)return;opening=true;pressed=true;draw();setTimeout(()=>{pressed=false;dialog.showModal();opening=false;draw()},reducedMotion.matches?0:150)});
dialog.addEventListener('close',()=>{hover=false;pressed=false;draw()});
let lastFrame=0;function animate(time){if(time-lastFrame>32){draw();lastFrame=time}requestAnimationFrame(animate)}requestAnimationFrame(animate);draw();
</script></body></html>
